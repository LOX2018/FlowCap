<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>抖音数据控制台 · Douyin Console</title>
<style>
:root {
  --bg: oklch(15.5% 0.012 245);
  --surface: oklch(19.5% 0.016 245);
  --surface-2: oklch(23% 0.018 245);
  --fg: oklch(93% 0.008 245);
  --muted: oklch(67% 0.02 245);
  --border: oklch(28% 0.02 245);
  --accent: oklch(76% 0.16 145);
  --accent-ink: oklch(16% 0.04 150);
  --ok: oklch(74% 0.15 150);
  --warn: oklch(79% 0.14 85);
  --danger: oklch(69% 0.19 25);
  --ok-bg: color-mix(in oklch, var(--ok) 15%, transparent);
  --warn-bg: color-mix(in oklch, var(--warn) 15%, transparent);
  --danger-bg: color-mix(in oklch, var(--danger) 15%, transparent);
  --accent-bg: color-mix(in oklch, var(--accent) 14%, transparent);

  --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  background-image:
    linear-gradient(color-mix(in oklch, var(--border) 22%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in oklch, var(--border) 22%, transparent) 1px, transparent 1px);
  background-size: 44px 44px;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

#root { min-height: 100vh; }

.app { display: flex; flex-direction: column; min-height: 100vh; }

.nav {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 22px;
  padding: 0 22px; height: 56px;
  background: color-mix(in oklch, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand .mark {
  width: 22px; height: 22px; border-radius: 6px; align-self: center;
  background: var(--accent); position: relative;
}
.brand .mark::after {
  content: ''; position: absolute; inset: 6px; border-radius: 3px;
  background: var(--accent-ink);
}
.brand h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
.brand .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.tabs { display: flex; gap: 2px; flex: 1; }
.tab {
  padding: 7px 13px; border-radius: 7px; font-size: 13.5px; color: var(--muted);
  transition: background .15s, color .15s; white-space: nowrap;
}
.tab:hover { background: var(--surface-2); color: var(--fg); }
.tab.active { background: var(--accent-bg); color: var(--accent); font-weight: 550; }
.nav-status { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.badge-conn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-size: 12px; color: var(--muted); font-family: var(--font-mono);
  letter-spacing: 0.03em;
}
.badge-conn b { font-weight: 500; color: var(--fg); font-family: var(--font-body); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.dot.pulse { animation: pulse 1.6s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 var(--ok-bg); }
  70% { box-shadow: 0 0 0 6px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.demo-tag {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--warn); border: 1px dashed color-mix(in oklch, var(--warn) 45%, transparent);
  padding: 2px 8px; border-radius: 6px; white-space: nowrap;
}

.main { flex: 1; padding: 22px; max-width: 1680px; width: 100%; margin: 0 auto; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
.section-head .desc { font-size: 13px; color: var(--muted); }
.head-row { display: flex; align-items: center; gap: 14px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; overflow: hidden;
}
.card h3 { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 14px; }
.cols-4 { grid-template-columns: repeat(4, 1fr); }
.cols-3 { grid-template-columns: repeat(3, 1fr); }
.cols-2 { grid-template-columns: repeat(2, 1fr); }
.cols-3-7 { grid-template-columns: 3fr 7fr; }

.stat { display: flex; flex-direction: column; gap: 10px; }
.stat .label { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }
.stat .num { font-family: var(--font-mono); font-size: 30px; font-weight: 550; letter-spacing: -0.01em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .num .unit { font-size: 14px; color: var(--muted); margin-left: 4px; font-weight: 400; }
.stat .spark { display: flex; align-items: flex-end; justify-content: space-between; }
.stat .delta { font-size: 12px; font-family: var(--font-mono); color: var(--ok); }
.stat .delta.down { color: var(--danger); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; line-height: 1.5; white-space: nowrap; }
.pill .bullet { width: 5px; height: 5px; border-radius: 50%; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 14px; border-radius: 8px; font-size: 13.5px; font-weight: 550;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: oklch(82% 0.16 145); }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--border); }
.btn.ghost:hover { background: oklch(26% 0.02 245); border-color: color-mix(in oklch, var(--border) 60%, var(--fg)); }
.btn.text { background: transparent; color: var(--accent); height: auto; padding: 0; }
.btn.text:hover { color: oklch(82% 0.16 145); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row-expand:focus-visible, .conv:focus-visible, .msg-inline:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px;
}
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; border-radius: 7px; }
.like-btn { position: relative; }
.like-cnt { margin-left: 6px; font-family: var(--font-mono); color: var(--accent); font-weight: 600; font-size: 12.5px; }
.burst { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--accent); pointer-events: none; animation: burstup .8s ease-out forwards; white-space: nowrap; text-shadow: 0 1px 6px color-mix(in oklch, var(--bg) 60%, transparent); }
@keyframes burstup { 0% { opacity: 0; transform: translate(-50%, 6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -16px); } }
.like-total { color: var(--muted); font-size: 12.5px; font-weight: 400; }
.batch-row { margin-top: 10px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
.batch-input { width: 88px; height: 34px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.input, .select, .textarea {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 0 12px; height: 36px; font-size: 13.5px; color: var(--fg);
  transition: border-color .15s;
}
.input::placeholder { color: color-mix(in oklch, var(--muted) 60%, var(--bg)); }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); outline: none; }
.select { padding: 0 30px 0 12px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.textarea { height: auto; padding: 10px 12px; resize: none; }

.searchbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.searchbar .input { flex: 1; min-width: 240px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { padding: 5px 12px; border-radius: 6px; font-size: 13px; color: var(--muted); transition: background .15s, color .15s; }
.seg button.active { background: var(--surface-2); color: var(--fg); font-weight: 550; }

.result-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.vcard { display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
.thumb { position: relative; aspect-ratio: 16/9; border-radius: 9px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.thumb .play { width: 34px; height: 34px; border-radius: 50%; background: color-mix(in oklch, var(--bg) 62%, transparent); border: 1px solid color-mix(in oklch, white 25%, transparent); display: grid; place-items: center; }
.thumb .play::after { content: ''; width: 0; height: 0; margin-left: 3px; border-style: solid; border-width: 6px 0 6px 10px; border-color: transparent transparent transparent white; }
.thumb .dur { position: absolute; right: 8px; bottom: 8px; font-family: var(--font-mono); font-size: 11px; color: white; background: color-mix(in oklch, var(--bg) 60%, transparent); padding: 1px 6px; border-radius: 5px; }
.thumb .src { position: absolute; left: 8px; top: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: white; background: color-mix(in oklch, var(--bg) 55%, transparent); padding: 1px 6px; border-radius: 5px; }
.vcard .t { font-size: 13.5px; font-weight: 550; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
.vcard .m { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vcard .row-ops { display: flex; gap: 6px; align-items: center; }
.vcard .row-ops .btn { flex: 1; }
.sk { position: relative; overflow: hidden; background: var(--surface-2); border-radius: 7px; }
.sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in oklch, white 7%, transparent), transparent); animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.sk-thumb { aspect-ratio: 16/9; border-radius: 9px; }
.sk-line { height: 12px; margin-top: 12px; }
.sk-line.w60 { width: 60%; }
.sk-line.w40 { width: 40%; }
.urow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.urow:last-child { border-bottom: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 600; color: var(--accent-ink); flex: none; }
.avatar.sm { width: 30px; height: 30px; font-size: 12px; }
.avatar.lg { width: 54px; height: 54px; font-size: 20px; }
.urow .info { flex: 1; min-width: 0; }
.urow .nm { font-weight: 600; font-size: 13.5px; }
.urow .sub { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; color: var(--accent); background: var(--accent-bg); border-radius: 5px; padding: 1px 6px; margin-left: 6px; font-family: var(--font-mono); letter-spacing: .04em; }

.feed { display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow-y: auto; }
.feed-item { display: flex; gap: 10px; align-items: baseline; padding: 7px 8px; border-radius: 7px; animation: slidein .35s ease both; }
.feed-item:hover { background: var(--surface-2); }
.feed-item .tm { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); flex: none; width: 52px; font-variant-numeric: tabular-nums; }
.feed-item .kind { font-family: var(--font-mono); font-size: 11px; flex: none; width: 34px; letter-spacing: .04em; }
.feed-item .txt { font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-item .txt b { font-weight: 600; }
.feed-item .lv { font-family: var(--font-mono); font-size: 11px; color: var(--warn); flex: none; }
.k-danmaku { color: var(--accent); }
.k-gift { color: var(--danger); }
.k-enter { color: var(--muted); }
.k-follow { color: var(--ok); }
.k-like { color: var(--warn); }
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.run-list { display: flex; flex-direction: column; gap: 12px; }
.run-item .top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 5px; }
.run-item .top .nm { font-weight: 550; }
.run-item .top .pct { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
.track { height: 5px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s ease; }

.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; }
.chart-grid line { stroke: var(--border); stroke-width: 1; }
.chart-area { fill: var(--accent); opacity: .1; }
.chart-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart-last { fill: var(--accent); }

.live-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.live-feed-card { max-height: 320px; }

.comment-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.comment-table th {
  text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px;
  letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.comment-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.comment-table tr { animation: slidein .3s ease both; }
.comment-table tbody tr:hover { background: var(--surface-2); }
.comment-table .content-cell { max-width: 260px; }
.cmt-text { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.speaker { display: inline-flex; align-items: center; gap: 8px; }
.speaker .nm { font-weight: 550; white-space: nowrap; }
.speaker .lv { font-family: var(--font-mono); font-size: 10.5px; color: var(--warn); border: 1px solid color-mix(in oklch, var(--warn) 40%, transparent); border-radius: 4px; padding: 0 4px; }
.dm-cell { max-width: 180px; }
.dm-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; color: var(--muted); }
.dm-text.has { color: var(--fg); }
.blank { color: var(--muted); font-family: var(--font-mono); }
.table-scroll { overflow-x: auto; }
.table-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.table-tools .input { flex: 1; min-width: 180px; height: 32px; font-size: 12.5px; }
.table-tools .select { height: 32px; font-size: 12.5px; }
.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.fpill { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--surface); transition: all .15s; }
.fpill:hover { color: var(--fg); border-color: var(--muted); }
.fpill.active { background: var(--surface-2); color: var(--fg); border-color: var(--fg); font-weight: 550; }
.fpill .c { font-family: var(--font-mono); font-size: 11px; margin-left: 5px; color: var(--muted); }
.count-line { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.count-line b { color: var(--fg); font-family: var(--font-mono); font-weight: 550; }

.overlay {
  position: fixed; inset: 0; z-index: 60;
  background: var(--bg);
  display: flex; flex-direction: column;
}
.drawer-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 61; width: 480px; max-width: 92vw; background: var(--bg); border-left: 1px solid var(--border); display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,.25); }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
.drawer-body { flex: 1; overflow: auto; padding: 16px 18px 24px; }
.drawer-foot { display: flex; gap: 8; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
.overlay-head {
  display: flex; align-items: center; gap: 12px; padding: 14px 20px;
  border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap;
}
.overlay-head h2 { font-size: 15px; font-weight: 600; }
.overlay-body { flex: 1; overflow: auto; padding: 18px 20px 40px; max-width: 1680px; width: 100%; margin: 0 auto; }
.row-expand { display: flex; gap: 10px; align-items: baseline; cursor: pointer; }
.detail-panel { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 10px 0; }
.detail-panel h4 { font-size: 12px; color: var(--muted); letter-spacing: .06em; margin-bottom: 8px; }
.history-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.history-item { display: flex; gap: 10px; font-size: 12.5px; align-items: baseline; }
.history-item .tm { font-family: var(--font-mono); color: var(--muted); font-size: 11px; flex: none; }

.conv-list { display: flex; flex-direction: column; overflow-y: auto; max-height: 600px; }
.conv { display: flex; gap: 11px; align-items: center; padding: 12px 10px; border-radius: 9px; cursor: pointer; border: 0; text-align: left; width: 100%; transition: background .15s; }
.conv:hover { background: var(--surface-2); }
.conv.active { background: var(--accent-bg); }
.conv .info { flex: 1; min-width: 0; }
.conv .nm { font-weight: 550; font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; }
.conv .nm .t { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-weight: 400; flex: none; }
.conv .pre { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unread { background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; flex: none; }
.thread { display: flex; flex-direction: column; height: 600px; }
.thread-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.thread-head .nm { font-weight: 600; }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 9px; max-width: 78%; animation: slidein .3s ease both; }
.msg.out { align-self: flex-end; flex-direction: row-reverse; }
.bubble { padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--border); }
.msg.out .bubble { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.msg .mtm { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); align-self: flex-end; flex: none; }
.bubble .voice { display: flex; align-items: center; gap: 8px; }
.voice-bars { display: flex; align-items: center; gap: 2px; height: 18px; }
.voice-bars i { width: 3px; background: currentColor; border-radius: 2px; opacity: .85; }
.bubble .vdur { font-family: var(--font-mono); font-size: 12px; }
.sticker { width: 76px; height: 76px; border-radius: 12px; display: grid; place-items: center; font-size: 30px; }
.imgtile { width: 150px; height: 110px; border-radius: 10px; display: grid; place-items: center; font-size: 12px; color: white; }
.vshare { display: flex; gap: 10px; align-items: center; min-width: 220px; }
.vshare .thumb { width: 84px; aspect-ratio: 16/9; border-radius: 8px; flex: none; }
.vshare .ti { font-size: 12.5px; font-weight: 550; line-height: 1.5; }
.vshare .st { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.composer { display: flex; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--border); align-items: flex-end; }
.composer .textarea { flex: 1; min-height: 38px; max-height: 120px; }
.newmsg-banner {
  position: absolute; top: -46px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: var(--accent-ink); font-size: 12.5px; font-weight: 550;
  padding: 6px 14px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
  animation: slidein .3s ease both; z-index: 5; white-space: nowrap; cursor: pointer;
}
.thread-wrap { position: relative; }

.table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; letter-spacing: .05em; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tbody tr:hover { background: var(--surface-2); }
.table .mono { font-variant-numeric: tabular-nums; }

.export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tree { font-family: var(--font-mono); font-size: 12.5px; line-height: 2; color: var(--muted); }
.tree .dir { color: var(--accent); }
.tree .cur { color: var(--fg); }

.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 550; color: var(--muted); letter-spacing: .02em; }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field-row { display: flex; gap: 8px; align-items: center; }
.field-row .input { flex: 1; font-family: var(--font-mono); font-size: 12px; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
.switch i { position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; transition: background .2s; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch input:checked + i { background: var(--accent); border-color: transparent; }
.switch input:checked + i::after { transform: translateX(18px); background: var(--accent-ink); }
.mask-toggle { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); flex: none; }
.mask-toggle:hover { color: var(--fg); }
.cookie-line { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
.cookie-line .site { width: 210px; font-family: var(--font-mono); font-size: 12px; color: var(--accent); flex: none; }
.cookie-line .val { flex: 1; font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-stream { font-family: var(--font-mono); font-size: 12px; line-height: 1.9; max-height: 320px; overflow-y: auto; }
.log-line { display: flex; gap: 10px; align-items: baseline; }
.log-line .tm { color: var(--muted); flex: none; }
.log-line .lvl { flex: none; width: 44px; }
.log-line .info { color: var(--ok); }
.log-line .warn { color: var(--warn); }
.log-line .err { color: var(--danger); }

.toasts { position: fixed; bottom: 20px; right: 20px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); color: var(--fg); font-size: 13px; padding: 10px 14px; border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.35); animation: slidein .25s ease both; max-width: 320px; }
.toast.err { border-left-color: var(--danger); }

.acct-card { display: flex; flex-direction: column; gap: 0; padding: 0; overflow: hidden; }
.acct-header { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border); }
.acct-header .info { flex: 1; min-width: 0; }
.acct-header .nm { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.acct-header .uid { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.acct-header .ops { display: flex; gap: 6px; flex-shrink: 0; }
.acct-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.acct-section { padding: 16px; }
.acct-section:first-child { border-right: 1px solid var(--border); }
.acct-section h4 { font-size: 11.5px; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 10px; text-transform: uppercase; }
.acct-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; font-size: 13px; }
.acct-row .k { color: var(--muted); flex: none; }
.acct-row .v { font-family: var(--font-mono); font-size: 12.5px; text-align: right; }
.acct-log-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.acct-log-cell { padding: 8px 10px; background: var(--bg); border-radius: 7px; }
.acct-log-cell .lc-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.acct-log-cell .lc-val { font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.fp-card { padding: 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; }
.fp-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.fp-header .nm { font-weight: 600; font-size: 13.5px; }
.fp-env { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.fp-env dt { font-size: 12px; color: var(--muted); }
.fp-env dd { font-family: var(--font-mono); font-size: 12.5px; }
.acct-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
.review-stats-row { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.acct-summary .stat .num { font-size: 28px; }
.batch-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--accent-bg); border: 1px solid var(--accent); border-radius: 8px; margin-bottom: 14px; }
.batch-count { font-size: 12.5px; color: var(--muted); }
.batch-chk { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; margin: 0; flex-shrink: 0; }

@media (max-width: 1180px) {
  .cols-4 { grid-template-columns: repeat(2, 1fr); }
  .cols-3 { grid-template-columns: 1fr 1fr; }
  .live-layout { grid-template-columns: 1fr; }
  .export-grid { grid-template-columns: 1fr; }
  .acct-summary { grid-template-columns: repeat(2, 1fr); }
  .review-stats-row { flex-wrap: wrap; }
  .review-stats-row .stat { min-width: calc(50% - 7px) !important; }
  .acct-body { grid-template-columns: 1fr; }
  .acct-section:first-child { border-right: 0; border-bottom: 1px solid var(--border); }
  .acct-log-grid { grid-template-columns: repeat(3, 1fr); }
  .nav { gap: 12px; padding: 0 12px; }
  .brand .sub { display: none; }
}
@media (max-width: 760px) {
  .cols-4, .cols-3, .cols-2, .cols-3-7 { grid-template-columns: 1fr; }
  .nav { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
  .tabs { order: 3; width: 100%; overflow-x: auto; }
  .main { padding: 14px; }
  .review-stats-row .stat { min-width: 100% !important; }
  .overlay-body > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="vendor/react.development.js"></script>
<script crossorigin src="vendor/react-dom.development.js"></script>
<script crossorigin src="vendor/babel.min.js"></script>
<script src="vendor/framer-motion.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const { motion, AnimatePresence } = window.Motion;

/* ---------- 工具 ---------- */
function tick(off) {
  const d = new Date(Date.now() + (off || 0));
  const p = n => (n < 10 ? '0' : '') + n;
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function nowHM() {
  const d = new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const HUES = ['150', '210', '300', '20', '40', '80', '260', '180'];
const hue = i => HUES[i % HUES.length];

/* ---------- 示例数据（已清除，等待真实后端驱动） ---------- */
const SPEAKERS = [];
const COMMENTS = [];
const GIFTS = [];
const DM_TEXTS = [];
const FEEDKIND = [];
const KIND_NAME = { danmaku: '弹幕', gift: '礼物', enter: '进场', follow: '关注', like: '点赞' };

const VIDEOS = [];
const USERS = [];
const LIVES = [];

const COMMENTS_DETAIL = [];

let cid = 0;

const TASKS_INIT = [];
const TASK_ST = { running: ['运行中', 'accent'], done: ['成功', 'ok'], queued: ['排队', 'mute'], fail: ['失败', 'danger'] };

const CONVS_INIT = [];

const LOGS = [];

/* ---------- 通用小件 ---------- */
function Spark({ pts, color = 'var(--accent)' }) {
  const w = 104, h = 30;
  const max = Math.max(...pts), min = Math.min(...pts);
  const x = i => (i / (pts.length - 1)) * w;
  const y = v => h - 3 - ((v - min) / (max - min || 1)) * (h - 6);
  const d = pts.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  return (
    <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} aria-hidden="true">
      <path d={d + ' L' + w + ' ' + h + ' L0 ' + h + ' Z'} fill={color} opacity=".12" />
      <path d={d} fill="none" stroke={color} strokeWidth="1.6" />
      <circle cx={x(pts.length - 1)} cy={y(pts[pts.length - 1])} r="2.4" fill={color} />
    </svg>
  );
}
function Pill({ c, children }) {
  const map = { ok: ['var(--ok)', 'var(--ok-bg)'], warn: ['var(--warn)', 'var(--warn-bg)'], danger: ['var(--danger)', 'var(--danger-bg)'], accent: ['var(--accent)', 'var(--accent-bg)'], mute: ['var(--muted)', 'var(--surface-2)'] };
  const [color, bg] = map[c] || map.mute;
  return <span className="pill" style={{ color, background: bg }}><span className="bullet" style={{ background: color }} />{children}</span>;
}
function Avatar({ name, h, sm, lg }) {
  return <span className={'avatar' + (sm ? ' sm' : '') + (lg ? ' lg' : '')} style={{ background: 'oklch(55% 0.14 ' + h + ')' }}>{name.charAt(0)}</span>;
}
function Dot({ c, pulse }) {
  return <span className={'dot ' + c + (pulse ? ' pulse' : '')} />;
}
function Num({ v }) { return <span className="mono">{v}</span>; }

/* ---------- 顶部导航 ---------- */
const TABS = [
  ['overview', '总览'], ['crawl', '采集'], ['live', '直播监听'],
  ['msg', '私信'], ['accounts', '账号管理'], ['tasks', '任务中心'], ['settings', '设置'],
];
function Header({ tab, setTab, overview, ready }) {
  const ov = overview || {};
  const running = !!ov.running;
  const paused = !!ov.paused;
  const statusColor = !ready ? 'mute' : (running ? (paused ? 'warn' : 'ok') : 'danger');
  const statusText = !ready ? '未连接' : (running ? (paused ? '已暂停' : '运行中') : '已停止');
  const bd = ov.browserDaemon || {};
  const rd = ov.recvDaemon || {};
  return (
    <header className="nav">
      <div className="brand">
        <span className="mark" aria-hidden="true" />
        <h1>抖音数据控制台</h1>
        <span className="sub">Douyin Console</span>
      </div>
      <nav className="tabs" aria-label="主导航">
        {TABS.map(([id, label]) => (
          <button key={id} data-od-id={'tab-' + id} className={'tab' + (tab === id ? ' active' : '')} onClick={() => setTab(id)}>{label}</button>
        ))}
      </nav>
      <div className="nav-status">
        <span className="badge-conn"><Dot c={statusColor} pulse={running && !paused} /> 引擎 <b>{statusText}</b></span>
        <span className="badge-conn"><Dot c={bd && bd.alive ? 'ok' : 'danger'} pulse={bd && bd.alive} /> 凭证守护 <b>{bd && bd.alive ? (bd.signReady ? '已就绪' : '登录中') : '离线'}</b></span>
        <span className="badge-conn"><Dot c={rd && rd.alive ? 'ok' : 'danger'} pulse={rd && rd.alive} /> 私信守护 <b>{rd && rd.alive ? '在线' : '离线'}</b></span>
        {ready && <span className="badge-conn"><b>已发 {ov.sent}/{ov.limit}{ov.queue ? ' · 待发 ' + ov.queue : ''}</b></span>}
        {!ready && <span className="demo-tag">未连接</span>}
      </div>
    </header>
  );
}

/* ---------- 总览 ---------- */
function Overview({ push, api, overview, ready }) {
  const [viewMode, setViewMode] = useState('single');
  const [activeAcct, setActiveAcct] = useState('');
  const [feed, setFeed] = useState([]);
  const [stats, setStats] = useState(null);
  const [accounts, setAccounts] = useState([]);
  const ov = overview || {};

  // 真实账号列表（来自后端 api.getAccounts）
  useEffect(() => {
    if (!ready) return;
    let alive = true;
    const load = () => api.getAccounts().then(d => { if (alive && d && d.ok) setAccounts(d.accounts || []); }).catch(() => {});
    load();
    const iv = setInterval(load, 3000);
    return () => { alive = false; clearInterval(iv); };
  }, [api, ready]);

  // 真实数据：拉取统计（评论记录），替换模拟 feed
  useEffect(() => {
    if (!ready) return;
    let alive = true;
    const load = () => api.getStats().then(d => { if (alive && d && d.ok) setStats(d); }).catch(() => {});
    load();
    const iv = setInterval(load, 2500);
    return () => { alive = false; clearInterval(iv); };
  }, [api, ready]);

  // 用真实统计构造 feed（按捕获时间倒序）
  const realFeed = (stats && stats.list || []).slice(0, 24).map((r, i) => ({
    id: 100000 + i,
    t: (r.captureTs || '').slice(-8) || '—',
    k: r.status === '已发送' || r.status === '私信已发送' ? 'msg' : 'danmaku',
    n: r.nickname || '未知',
    l: 0,
    x: (r.comment || '') + (r.content ? ' → 私信: ' + r.content : ''),
  }));
  const shownFeed = (ready && realFeed.length) ? realFeed : feed;

  const statCards = ready ? [
    { label: '已发私信', num: (ov.sent || 0).toLocaleString() + '/' + (ov.limit || 0), delta: '待发 ' + (ov.queue || 0), color: 'var(--accent)' },
    { label: '捕获评论', num: (stats ? stats.total : 0).toLocaleString() + ' 条', delta: '已发 ' + (stats ? stats.sent : 0), color: 'var(--ok)' },
    { label: '账号', num: (ov.browserDaemon && ov.browserDaemon.alive ? '凭证就绪' : '凭证离线'), delta: (ov.recvDaemon && ov.recvDaemon.alive ? '私信守护在线' : '私信守护离线'), color: 'var(--warn)' },
    { label: '引擎状态', num: ov.running ? (ov.paused ? '已暂停' : '运行中') : '已停止', delta: ov.status || '', color: 'var(--accent)' },
  ] : null;

  const taskList = ready ? (
    <div className="run-item">
      <div className="top"><span className="nm">自动私信引擎 · {ov.liveUrl || '未配置直播间'}</span><span className="pct" style={{ color: ov.running ? 'var(--ok)' : 'var(--muted)' }}>{ov.running ? (ov.paused ? '已暂停' : '运行中') : '未启动'}</span></div>
      <div className="track"><div className="bar" style={{ width: (ov.limit ? Math.min(100, Math.round((ov.sent || 0) / ov.limit * 100)) : 0) + '%' }} /></div>
    </div>
  ) : TASKS_INIT.slice(0, 2).map(t => (
    <div className="run-item" key={t.id}>
      <div className="top"><span className="nm">{t.type} · {t.target}</span><span className="pct">{t.status === 'running' ? t.prog + '%' : '完成'}</span></div>
      <div className="track"><div className="bar" style={{ width: (t.status === 'running' ? t.prog : 100) + '%' }} /></div>
    </div>
  ));

  // 真实当前账号：优先选中项，否则默认账号
  const curAcct = accounts.find(a => a.name === activeAcct) || accounts.find(a => a.isCurrent) || accounts[0] || null;

  // 多账户总览卡片（全部基于真实账号字段）
  const gridCards = accounts.map(acct => (
    <div className="card" key={acct.name} style={{ padding: 0, overflow: 'hidden' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 16px', borderBottom: '1px solid var(--border)', background: 'var(--surface-2)' }}>
        <Avatar name={acct.name} h={20} />
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 600, fontSize: 14 }}>{acct.name}{acct.isCurrent ? ' · 当前' : ''}</div>
          <div className="mono" style={{ fontSize: 11.5, color: 'var(--muted)' }}>UID: {acct.uid || '—'}</div>
        </div>
        <Pill c={acct.loggedIn ? 'ok' : 'danger'}>{acct.loggedIn ? (acct.signReady ? '已登录·签名就绪' : '已登录') : '离线'}</Pill>
      </div>
      <div className="grid cols-2" style={{ padding: '10px 16px', gap: 6 }}>
        <div className="card stat" style={{ padding: '6px 8px' }}>
          <span className="label" style={{ fontSize: 10 }}>监测角色</span>
          <span className="num" style={{ fontSize: 14 }}>{acct.isMonitor ? '是' : '否'}</span>
        </div>
        <div className="card stat" style={{ padding: '6px 8px' }}>
          <span className="label" style={{ fontSize: 10 }}>发送角色</span>
          <span className="num" style={{ fontSize: 14 }}>{acct.isSender ? '是' : '否'}</span>
        </div>
      </div>
      <div style={{ padding: '10px 16px', borderTop: '1px solid var(--border)' }}>
        <div className="head-row" style={{ marginBottom: 6 }}>
          <span style={{ fontSize: 12, color: 'var(--muted)' }}>守护状态</span>
          <span className="mono" style={{ fontSize: 12, fontWeight: 600 }}>{ready && ov.browserDaemon && ov.browserDaemon.alive ? '凭证守护在线' : '守护离线'}</span>
        </div>
        <div className="head-row">
          <span style={{ fontSize: 12, color: 'var(--muted)' }}>私信守护</span>
          <span className="mono" style={{ fontSize: 12 }}>{ready && ov.recvDaemon && ov.recvDaemon.alive ? '在线' : '离线'}</span>
        </div>
      </div>
      <div style={{ padding: '8px 16px', borderTop: '1px solid var(--border)', display: 'flex', gap: 6 }}>
        <button className="btn sm ghost" style={{ flex: 1 }} onClick={() => { setViewMode('single'); setActiveAcct(acct.name); push('已切换到 ' + acct.name); }}>查看详情</button>
      </div>
    </div>
  ));

  return (
    <div>
      <div className="section-head">
        <div>
          <h2>总览</h2>
          <div className="desc">系统运行状态与账号概况</div>
        </div>
        <div className="head-row">
          <div className="seg">
            <button className={viewMode === 'single' ? 'active' : ''} onClick={() => setViewMode('single')}>单账户</button>
            <button className={viewMode === 'grid' ? 'active' : ''} onClick={() => setViewMode('grid')}>多账户总览</button>
          </div>
          <span className="badge-conn"><Dot c={!ready ? 'mute' : (ov.running ? (ov.paused ? 'warn' : 'ok') : 'danger')} pulse={ready && ov.running && !ov.paused} /> {ready ? (ov.running ? (ov.paused ? '已暂停' : '引擎运行中') : '引擎已停止') : '未连接'}</span>
          {ready && <span className="badge-conn"><b>已发 {ov.sent}/{ov.limit}{ov.queue ? ' · 待发 ' + ov.queue : ''}</b></span>}
        </div>
      </div>

      {viewMode === 'grid' ? (
        <div className="grid cols-2" data-od-id="overview-grid">
          {gridCards.length ? gridCards : <div className="feed-item" style={{ color: 'var(--muted)' }}>暂无账号数据</div>}
        </div>
      ) : (
        <>
          <div className="card" style={{ marginBottom: 14 }} data-od-id="overview-acct-select">
            <div className="head-row">
              <span style={{ fontSize: 13, fontWeight: 600 }}>当前查看账号</span>
              <div style={{ flex: 1 }} />
              <div className="seg">
                {accounts.map(a => (
                  <button key={a.name} className={activeAcct === a.name ? 'active' : ''} onClick={() => { setActiveAcct(a.name); push('已切换到 ' + a.name); }}>
                    <Avatar name={a.name} h={20} sm /> {a.name}
                  </button>
                ))}
              </div>
            </div>
            {curAcct && (
              <div className="head-row" style={{ marginTop: 10, fontSize: 12, color: 'var(--muted)' }}>
                <span>UID: {curAcct.uid || '—'}</span>
                <span>登录: {curAcct.loggedIn ? '是' : '否'}</span>
                <span>签名: {curAcct.signReady ? '就绪' : '未就绪'}</span>
                <span>监测: {curAcct.isMonitor ? '是' : '否'}</span>
                <span>发送: {curAcct.isSender ? '是' : '否'}</span>
              </div>
            )}
          </div>

          <div className="grid cols-4" style={{ marginBottom: 14 }}>
            {(statCards || []).map((c, i) => (
              <div className="card stat" key={i} data-od-id={'stat-' + i}>
                <span className="label">{c.label}</span>
                <span className="num">{c.num}<span className="unit"> </span></span>
                <div className="spark"><span className="delta" style={{ color: c.color }}>{c.delta}</span></div>
              </div>
            ))}
          </div>
          <div className="grid cols-2">
            <div className="card" data-od-id="overview-feed">
              <h3>实时动态 <span className="demo-tag" style={{ textTransform: 'none' }}>{ready ? '实时' : '未连接'}</span></h3>
              <div className="feed">
                {shownFeed.map(f => (

  useEffect(() => {
    if (!ready) return;

    const load = () => {
      api.getTasks().then(t => { if (alive && t && t.ok) setTasksCfg(t); }).catch(() => {});
      api.getStats().then(d => {
        if (!alive || !d || !d.ok) return;
        const realRows = d.list.map((r, i) => ({
          id: 200000 + i,
          time: (r.captureTs || '').slice(-8) || '—',
          name: r.nickname || '未知',

          content: r.comment || '',
          dmStatus: (r.status && r.status.indexOf('发送') >= 0) ? 'sent' : 'un',
          dmText: r.content || '',
          dmTime: r.sendTs || '',
          ts: Date.now() - i * 1000,
        }));

        const realFeed = d.list.slice(0, 30).map((r, i) => ({
          id: 300000 + i, t: (r.captureTs || '').slice(-8) || '—',
          k: (r.status && r.status.indexOf('发送') >= 0) ? 'msg' : 'danmaku',
          n: r.nickname || '未知', l: 0, x: r.comment || '',
        }));
        if (realFeed.length) setFeed(realFeed);
      }).catch(() => {});
    };
    load();
    const iv = setInterval(load, 2500);

        setRows(r => [{ id: ++cid, time: t, name: nm, lv, content: txt, dmStatus: st, dmText: dmt, dmTime: st === 'sent' ? t : '', ts: Date.now() }, ...r]);

              <div className="feed" style={{ maxHeight: 236 }}>
                {feed.map(f => (
                  <div className="feed-item" key={f.id}>
                    <span className="tm">{f.t}</span>
                    <span className={'kind k-' + f.k}>{KIND_NAME[f.k]}</span>
                    <span className="txt"><b>{f.n}</b>　{f.x}</span>
                    <span className="lv">Lv.{f.l}</span>
                  </div>

              </div>
              <div className="head-row" style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--border)' }}>

function ReviewMode({ rows, onClose, push, sendDm, goMsg }) {
  const [q, setQ] = useState('');
  const [st, setSt] = useState('all');
  const [asc, setAsc] = useState(false);
  const [exp, setExp] = useState(null);

  const filtered = useMemo(() => {
    let list = rows.slice();
    if (st !== 'all') list = list.filter(r => r.dmStatus === st);
    if (q.trim()) { const kw = q.trim(); list = list.filter(r => (r.name + r.content + r.dmText).includes(kw)); }
    list.sort((a, b) => asc ? a.ts - b.ts : b.ts - a.ts);
    return list;
  }, [rows, q, st, asc]);

  const cnt = s => rows.filter(r => r.dmStatus === s).length;
  const exportCSV = () => {
    const head = ['发送时间', '发言人', '用户等级', '评论内容', '私信状态', '私信文案', '私信时间'];
    const body = filtered.map(r => [r.time, r.name, r.lv, r.content, DM_META[r.dmStatus][0], r.dmText || '', r.dmTime || '']);
    const csv = [head, ...body].map(l => l.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'}));
    a.download = 'live_comments_' + tick().replace(/:/g, '') + '.csv';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    push('已导出 CSV · ' + a.download);
  };

  return (
    <motion.div className="overlay" initial={{ opacity: 0, y: 14 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} transition={{ duration: .18 }} data-od-id="live-review">
      <div className="overlay-head">
        <button className="btn ghost" data-od-id="review-back" onClick={onClose}>‹ 返回实时流</button>
        <h2>评论查阅模式</h2>
        <div style={{ flex: 1 }} />
        <span className="demo-tag">只读 · 实时入库</span>
      </div>
      <div className="overlay-body">
        <div className="table-tools">
          <input className="input" placeholder="搜索昵称 / 评论内容 / 私信文案…" value={q} onChange={e => setQ(e.target.value)} />
          <select className="select" value={st} onChange={e => setSt(e.target.value)} aria-label="私信状态筛选">
            <option value="all">全部状态</option>
            <option value="un">未私信</option><option value="wait">待发送</option>
            <option value="sent">已发送</option><option value="fail">发送失败</option>
          </select>
          <button className="btn ghost" onClick={() => setAsc(s => !s)}>{asc ? '时间 ↑' : '时间 ↓'}</button>
          <button className="btn ghost" onClick={() => { setSt('all'); setQ(''); }}>重置</button>
          <button className="btn primary" data-od-id="review-export" onClick={exportCSV}>导出 CSV</button>
        </div>
        <div className="count-line">共 <b>{filtered.length}</b> 条 · <span className="filter-pills" style={{ display: 'inline-flex', marginLeft: 10, verticalAlign: 'middle' }}>
          {[['all', '全部', rows.length], ['un', '未私信', cnt('un')], ['wait', '待发送', cnt('wait')], ['sent', '已发送', cnt('sent')], ['fail', '发送失败', cnt('fail')]].map(([id, l, c]) => (
            <button key={id} className={'fpill' + (st === id ? ' active' : '')} onClick={() => setSt(id)}>{l}<span className="c">{c}</span></button>
          ))}
        </span></div>
        <div className="card" style={{ padding: 0 }}>
          <div className="table-scroll">
            <table className="comment-table">
              <thead>
                <tr>
                  <th style={{ width: 30 }} />
                  <th>发送时间</th><th>发言人</th><th>评论内容</th><th>私信状态</th><th>私信文案</th><th>私信时间</th><th style={{ width: 150 }}>操作</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(r => (
                  <React.Fragment key={r.id}>
                    <tr key={r.id}>
                      <td><span className="mono" style={{ color: 'var(--muted)' }}>{exp === r.id ? '▾' : '▸'}</span></td>
                      <td className="mono">{r.time}</td>
                      <td>
                        <span className="speaker">
                          <Avatar name={r.name} h={hue(r.name.length)} sm />
                          <span className="nm">{r.name}</span>
                          {r.lv < 99 && <span className="lv">Lv.{r.lv}</span>}
                        </span>
                      </td>
                      <td className="content-cell"><span className="cmt-text">{r.content}</span></td>
                      <td>{r.dmStatus === 'un' ? <span className="blank">—</span> : <Pill c={DM_META[r.dmStatus][1]}>{DM_META[r.dmStatus][0]}</Pill>}</td>
                      <td className="dm-cell"><span className={'dm-text' + (r.dmText ? ' has' : '')}>{r.dmText || <span className="blank">未发送</span>}</span></td>
                      <td className="mono">{r.dmTime || <span className="blank">—</span>}</td>
                      <td>
                        <div className="head-row" style={{ gap: 6 }}>
                          <button className="btn text sm" onClick={() => { setExp(exp === r.id ? null : r.id); }}>详情</button>
                          <button className="btn text sm" onClick={() => sendDm(r)}>发私信</button>
                          <button className="btn text sm" onClick={() => goMsg(r.name, r.dmText || pick(DM_TEXTS))}>去私信中心</button>
                        </div>
                      </td>
                    </tr>
                    {exp === r.id && (
                      <tr key={r.id + '-d'}>
                        <td colSpan="8" style={{ padding: '6px 10px 14px', background: 'var(--surface-2)' }}>
                          <div className="detail-panel">
                            <h4>发言历史 · {r.name}</h4>
                            <div className="history-list">
                              {rows.filter(x => x.name === r.name).slice(0, 5).map((x, i) => (
                                <div className="history-item" key={i}><span className="tm">{x.time}</span><span>{x.content}</span></div>
                              ))}
                            </div>
                            <h4>私信内容</h4>
                            <div style={{ fontSize: 13 }}>
                              {r.dmStatus === 'un' ? <span className="blank">尚未对该发言人发送私信</span> :
                                <span><Pill c={DM_META[r.dmStatus][1]}>{DM_META[r.dmStatus][0]}</Pill>　{r.dmText || '（文案未填写）'}{r.dmTime ? '　·　' + r.dmTime : ''}</span>}
                            </div>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </motion.div>
  );
}

/* ---------- 私信中心 ---------- */
const MSG_STYLE = { sticker: ['oklch(70% 0.13 300)', '✨'], image: ['oklch(45% 0.13 210)', '图片'], video: ['oklch(42% 0.13 150)', '分享的视频'] };
function MsgBubble({ m, h }) {
  if (m.type === 'text') return <div className="bubble">{m.text}</div>;
  if (m.type === 'voice') return (
    <div className="bubble"><div className="voice"><span className="voice-bars">{[10, 18, 14, 22, 12, 20, 8, 16].map((hgt, i) => <i key={i} style={{ height: hgt }} />)}</span><span className="vdur">{m.dur}</span></div></div>
  );

function Messages({ push, goDm, api }) {
  const [activeAcct, setActiveAcct] = useState('a1');

  const [active, setActive] = useState('c2');

  const [newName, setNewName] = useState('');

  const acctConvs = convs.filter(c => c.acct === activeAcct);

  // 真实会话数据（来自 recv_daemon 9912）
  useEffect(() => {
    if (!window.ApiBridge || !window.ApiBridge.ready) return;
    let alive = true;
    const load = () => api.getConversations(activeAcct).then(d => {
      if (!alive || !d || !d.ok) return;
      const list = d.conversations || [];
      if (list.length) {
        const mapped = list.map((c, i) => ({
          id: 'rc' + i, conv_id: c.conv_id, acct: activeAcct, hue: hue((c.name || 'x').length * 2),
          name: c.name || ('会话' + i), unread: c.unread || 0,
          msgs: (c.messages || []).map((m, j) => ({
            id: 'rm' + i + '_' + j, dir: m.dir || 'in',
            type: m.type || 'text', text: m.text || '', mt: m.time || nowHM(),
          })),
        }));
        setRealConvs(mapped);
      }
    }).catch(() => {});
    load();
    const iv = setInterval(load, 2500);
    return () => { alive = false; clearInterval(iv); };
  }, [api, activeAcct]);

  const shownConvs = realConvs || acctConvs;

  useEffect(() => {
    if (!goDm) return;
    const { name, text } = goDm;
    const existing = convs.find(c => c.name === name);
    if (existing) {
      setActiveAcct(existing.acct);
      setActive(existing.id);
      setDraft(text || '');
    } else {
      const nc = { id: 'c' + (convs.length + 1), acct: activeAcct, hue: hue(name.length * 2), name, unread: 0, msgs: [{ id: ++cid, dir: 'in', type: 'text', text: '你好，很高兴认识你', mt: nowHM() }] };
      setConvs(c => [nc, ...c]);
      setActive(nc.id);
      setDraft(text || '');
    }
    push('已打开 ' + name + ' 的会话，文案已预填');
  }, [goDm]);

  useEffect(() => {
    if (window.ApiBridge && window.ApiBridge.ready) return;  // 真实模式不跑 mock
    if (!SPEAKERS.length) return;      // 示例数据已清除，离线时不生成假消息
    const iv = setInterval(() => {
      const [nm] = pick(SPEAKERS);
      setConvs(cs => cs.map(c => c.acct === activeAcct && c.name === nm

        : c));
      setNewBanner(true);
      clearTimeout(bannerT.current);
      bannerT.current = setTimeout(() => setNewBanner(false), 4000);
    }, 9000);
    return () => clearInterval(iv);
  }, [activeAcct]);

  const conv = shownConvs.find(c => c.id === active) || shownConvs[0] || convs[0] || { id: '', name: '暂无会话', hue: 0, msgs: [] };
  const send = () => {
    if (!draft.trim()) return;
    if (window.ApiBridge && window.ApiBridge.ready && conv && conv.id && conv.id.indexOf('rc') === 0) {
      // 真实发送：经 recv_daemon 回复
      const convId = (conv.realId != null) ? conv.realId : (conv.conv_id || conv.id);
      api.sendDm(activeAcct, convId, draft.trim()).then(r => {
        if (r && r.ok) { push('私信已发送'); setDraft(''); }

      }).catch(e => push('发送异常: ' + e));
      return;
    }
    setConvs(cs => cs.map(c => c.id === conv.id ? { ...c, msgs: [...c.msgs, { id: ++cid, dir: 'out', type: 'text', text: draft.trim(), mt: nowHM() }] } : c));
    setDraft('');
    push('私信已发送');

  const openConv = (id) => {

    setConvs(cs => cs.map(c => c.id === id ? { ...c, unread: 0 } : c));
  };
  const createConv = () => {
    const nm = newName.trim();
    if (!nm) { push('请输入对方昵称'); return; }
    const existing = convs.find(c => c.name === nm);
    if (existing) { setActiveAcct(existing.acct); setActive(existing.id); setShowNew(false); setNewName(''); setDraft(''); push('已打开已有会话 ' + nm); return; }
    const nc = { id: 'c' + (convs.length + 1), acct: activeAcct, hue: hue(nm.length * 2), name: nm, unread: 0, msgs: [{ id: ++cid, dir: 'in', type: 'text', text: '你好，很高兴认识你', mt: nowHM() }] };
    setConvs(c => [nc, ...c]);
    setActive(nc.id);
    setShowNew(false);
    setNewName('');
    push('已创建会话 ' + nm);
  };

  return (

        </div>
        <div className="head-row">

            ? <span className="badge-conn"><Dot c="ok" pulse /> 已连接（接收守护）</span>

        </div>
      </div>
      <div className="card" style={{ marginBottom: 12 }} data-od-id="msg-acct-select">
        <div className="head-row">
          {curAcct ? (

              <Avatar name={curAcct.name} h={curAcct.hue} />

                <div style={{ fontWeight: 600, fontSize: 13.5 }}>当前私信账号 · {curAcct.name}</div>
                <div className="mono" style={{ fontSize: 11.5, color: 'var(--muted)' }}>UID {curAcct.uid} · 会话按账号隔离</div>
              </div>
              <Pill c={curAcct.tokenValid ? 'ok' : 'danger'}>{curAcct.tokenValid ? '凭证有效' : '凭证过期'}</Pill>
            </>
          ) : (
            <div style={{ flex: 1, fontSize: 13.5, color: 'var(--muted)' }}>暂无账号 · 请在「账号」页添加并登录</div>
          )}
          <div className="seg" style={{ marginLeft: 6 }}>
            {ACCOUNTS_INIT.filter(a => a.tokenValid).map(a => (
              <button key={a.id} className={activeAcct === a.id ? 'active' : ''} onClick={() => { const first = convs.find(c => c.acct === a.id); setActiveAcct(a.id); setActive(first ? first.id : ''); push('已切换到 ' + a.name + ' 的私信通道'); }}>
                <Avatar name={a.name} h={a.hue} sm /> {a.name}

          </div>
        </div>
      </div>
      <div className="grid cols-3-7" data-od-id="messages-panel">
        <div className="card" style={{ padding: 8 }}>
          <div className="head-row" style={{ padding: '4px 8px 10px' }}>
            <h3 style={{ marginBottom: 0 }}>会话列表</h3>
            <div style={{ flex: 1 }} />
            <button className="btn sm ghost" data-od-id="new-conv" onClick={() => setShowNew(s => !s)}>{showNew ? '取消' : '＋ 新建会话'}</button>
          </div>
          <div className="conv-list">
            {showNew && (
              <div className="head-row" style={{ padding: '2px 8px 8px', gap: 8 }} data-od-id="new-conv-form">
                <input className="input" style={{ flex: 1, height: 34, fontSize: 12.5 }} autoFocus placeholder="输入对方昵称，回车创建…" value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') createConv(); if (e.key === 'Escape') setShowNew(false); }} />
                <button className="btn sm ghost" onClick={createConv}>创建</button>

            {shownConvs.map(c => (
              <button className={'conv' + (c.id === active ? ' active' : '')} data-od-id={'conv-' + c.id} key={c.id} onClick={() => openConv(c.id)}>
                <Avatar name={c.name} h={c.hue} />

                  <span className="nm">{c.name}<span className="t">{(c.msgs && c.msgs.length) ? c.msgs[c.msgs.length - 1].mt : ''}</span></span>

        <div className="card">
          <h3>私信同步</h3>

            <div className="field"><label>单次同步上限</label><input className="input" style={{ width: '100%', fontFamily: 'var(--font-mono)' }} value={DEFAULTS.syncLimit} readOnly /></div>
            <div className="field-row"><label style={{ flex: 1 }}>接收图片/视频</label><span className="switch"><input type="checkbox" checked={DEFAULTS.recvMedia} readOnly /><i /></span></div>
          </div>
        </div>
      </div>

      <div className="grid cols-2" style={{ marginBottom: 14 }}>
        <div className="card">
          <h3>任务管理</h3>
          <div className="form" style={{ display: 'flex', flexDirection: 'row', flexWrap: 'wrap', gap: 16, alignItems: 'center' }}>
            <div className="field" style={{ flexDirection: 'row', alignItems: 'center', gap: 8 }}><label style={{ whiteSpace: 'nowrap' }}>最大并发</label><input className="input" style={{ width: 60, fontFamily: 'var(--font-mono)' }} value={DEFAULTS.maxTasks} readOnly /></div>
            <div className="field" style={{ flexDirection: 'row', alignItems: 'center', gap: 8 }}><label style={{ whiteSpace: 'nowrap' }}>重试次数</label><input className="input" style={{ width: 60, fontFamily: 'var(--font-mono)' }} value={DEFAULTS.retry} readOnly /></div>
            <div className="field" style={{ flexDirection: 'row', alignItems: 'center', gap: 8 }}><label style={{ whiteSpace: 'nowrap' }}>超时（秒）</label><input className="input" style={{ width: 60, fontFamily: 'var(--font-mono)' }} value={DEFAULTS.timeout} readOnly /></div>
          </div>
        </div>
        <div className="card">
          <h3>输出与日志</h3>
          <div className="form" style={{ display: 'flex', flexDirection: 'row', flexWrap: 'wrap', gap: 16, alignItems: 'center' }}>
            <div className="field" style={{ flexDirection: 'row', alignItems: 'center', gap: 8, flex: 1 }}><label style={{ whiteSpace: 'nowrap' }}>输出目录</label><input className="input mono" style={{ flex: 1 }} value={DEFAULTS.outDir} readOnly /><button className="btn sm ghost" data-od-id="settings-pick-path" onClick={() => push('已选择输出目录 · ' + DEFAULTS.outDir)}>选择路径</button></div>
            <div className="field-row"><label>自动导出</label><span className="switch"><input type="checkbox" checked={DEFAULTS.autoExport} readOnly /><i /></span></div>
            <div className="field-row"><label>日志写文件</label><span className="switch"><input type="checkbox" checked={DEFAULTS.logFile} readOnly /><i /></span></div>
          </div>
        </div>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 20, marginBottom: 10 }}>
        <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--warn)' }}>&#9679;</span>
        <span style={{ fontSize: 14, fontWeight: 700 }}>独立配置</span>
        <span style={{ fontSize: 12, color: 'var(--muted)' }}>开启后该账号使用独立参数，未填写的字段仍使用默认值</span>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {ACCOUNTS_INIT.map(a => {
          const ov = overrides[a.id] || { enabled: false };
          const isExpanded = expandedAcct === a.id;
          const overriddenCount = ov.enabled ? Object.keys(ov).filter(k => k !== 'enabled' && ov[k] !== undefined && ov[k] !== DEFAULTS[k]).length : 0;
          return (
            <div className="card" key={a.id} style={{ padding: 0, overflow: 'hidden', borderLeft: ov.enabled ? '3px solid var(--warn)' : undefined }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 16px', cursor: 'pointer' }} onClick={() => setExpandedAcct(isExpanded ? null : a.id)}>
                <Avatar name={a.name} h={a.hue} sm />
                <span style={{ fontWeight: 600, fontSize: 13 }}>{a.name}</span>
                <span className="mono" style={{ fontSize: 11.5, color: 'var(--muted)' }}>{a.uid}</span>
                <div style={{ flex: 1 }} />
                {ov.enabled && overriddenCount > 0 && <Pill c="warn">{overriddenCount} 项已覆盖</Pill>}
                {ov.enabled && overriddenCount === 0 && <Pill c="mute">已启用 · 无覆盖</Pill>}
                {!ov.enabled && <Pill c="mute">使用默认</Pill>}
                <span className="switch" onClick={e => e.stopPropagation()}>
                  <input type="checkbox" checked={ov.enabled} onChange={() => toggleOverride(a.id)} aria-label={'启用 ' + a.name + ' 独立配置'} /><i />
                </span>
                <span style={{ fontSize: 12, color: 'var(--muted)', transition: 'transform .15s', transform: isExpanded ? 'rotate(90deg)' : '' }}>&#9656;</span>
              </div>

              {isExpanded && ov.enabled && (
                <div style={{ padding: '12px 16px', borderTop: '1px solid var(--border)', background: 'var(--surface-2)' }}>
                  <div className="grid cols-3" style={{ gap: 10 }}>
                    <div className="card" style={{ padding: 10 }}>
                      <h4 style={{ fontSize: 12, marginBottom: 8 }}>Cookie</h4>
                      <div className="field" style={{ marginBottom: 6 }}><label style={{ fontSize: 11 }}>www.douyin.com</label><input className="input mono" style={{ fontSize: 11 }} placeholder={'默认: ' + (DEFAULTS.cookieWww || '未配置')} value={ov.cookieWww || ''} onChange={e => setOverride(a.id, 'cookieWww', e.target.value)} /></div>
                      <div className="field" style={{ marginBottom: 0 }}><label style={{ fontSize: 11 }}>live.douyin.com</label><input className="input mono" style={{ fontSize: 11 }} placeholder={'默认: ' + (DEFAULTS.cookieLive || '未配置')} value={ov.cookieLive || ''} onChange={e => setOverride(a.id, 'cookieLive', e.target.value)} /></div>
                    </div>
                    <div className="card" style={{ padding: 10 }}>
                      <h4 style={{ fontSize: 12, marginBottom: 8 }}>直播策略</h4>
                      <div className="field" style={{ marginBottom: 6 }}><label style={{ fontSize: 11 }}>私信上限</label><input className="input" style={{ width: '100%', fontFamily: 'var(--font-mono)', fontSize: 11 }} placeholder={'默认: ' + DEFAULTS.dmPerLive} value={ov.dmPerLive || ''} onChange={e => setOverride(a.id, 'dmPerLive', e.target.value)} /></div>
                      <div className="field" style={{ marginBottom: 6 }}><label style={{ fontSize: 11 }}>私信间隔（秒）</label><input className="input" style={{ width: '100%', fontFamily: 'var(--font-mono)', fontSize: 11 }} placeholder={'默认: ' + DEFAULTS.dmInterval} value={ov.dmInterval || ''} onChange={e => setOverride(a.id, 'dmInterval', e.target.value)} /></div>
                      <div className="field" style={{ marginBottom: 0 }}><label style={{ fontSize: 11 }}>请求频率（ms）</label><input className="input" style={{ width: '100%', fontFamily: 'var(--font-mono)', fontSize: 11 }} placeholder={'默认: ' + DEFAULTS.rateLimit} value={ov.rateLimit || ''} onChange={e => setOverride(a.id, 'rateLimit', e.target.value)} /></div>
                    </div>
                    <div className="card" style={{ padding: 10 }}>
                      <h4 style={{ fontSize: 12, marginBottom: 8 }}>状态总览</h4>
                      <div style={{ fontSize: 12, display: 'grid', gridTemplateColumns: '70px 1fr', gap: '4px 8px' }}>
                        <span style={{ color: 'var(--muted)' }}>凭证</span><Pill c={a.tokenValid ? 'ok' : 'danger'}>{a.tokenValid ? '有效' : '过期'}</Pill>
                        <span style={{ color: 'var(--muted)' }}>指纹浏览器</span><span className="mono" style={{ fontSize: 11 }}>{a.fp.name}</span>
                        <span style={{ color: 'var(--muted)' }}>代理</span><span className="mono" style={{ fontSize: 11 }}>{a.fp.proxy}</span>
                        <span style={{ color: 'var(--muted)' }}>上次运行</span><span className="mono" style={{ fontSize: 11 }}>{a.lastRun.time}</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ marginTop: 14, display: 'flex', gap: 8 }}>
        <button className="btn primary" onClick={() => push('全部配置已保存')}>保存全部配置</button>
        <button className="btn ghost" onClick={() => push('已重置所有独立配置为默认值')}>重置全部为默认</button>
      </div>
    </div>
  );
}

/* ---------- 账号管理 ---------- */
const ACCOUNTS_INIT = [];
function Accounts({ push, goMsg, api }) {
  const [accounts, setAccounts] = useState(ACCOUNTS_INIT);
  const [reviewAccount, setReviewAccount] = useState(null);
  const [proxyAcct, setProxyAcct] = useState(null);
  const [proxyForm, setProxyForm] = useState({ type: 'socks5', host: '127.0.0.1', port: '1080', user: '', pass: '', testUrl: '' });
  const [proxyTesting, setProxyTesting] = useState(false);
  const [proxyTestResult, setProxyTestResult] = useState(null);
  const [addOpen, setAddOpen] = useState(false);
  const [addForm, setAddForm] = useState({ name: '', uid: '', cookie: '' });
  const [batchMode, setBatchMode] = useState(false);
  const [batchSel, setBatchSel] = useState(() => new Set());
  const [realAccts, setRealAccts] = useState(null);

  // 真实账号加载
  useEffect(() => {
    if (!window.ApiBridge || !window.ApiBridge.ready) return;
    let alive = true;
    const load = () => api.getAccounts().then(d => {
      if (!alive || !d || !d.ok) return;
      const list = d.accounts || [];
      if (list.length) {
        setRealAccts(list.map((a, i) => ({
          id: 'ra' + i, name: a.name, uid: a.uid || '—',
          hue: hue(a.name.length * 2),
          tokenValid: a.signReady,
          tokenExpire: a.loggedIn ? '有效' : '过期',
          lastCheck: '刚刚',
          lastRun: { room: '—', roomUrl: '', time: '—', duration: '—', totalRuns: 0, comments: 0, dmSent: 0, dmSuccess: 0, dmFail: 0, dmAfterLive: 0 },
          fp: { name: '浏览器守护 · ' + a.name, status: 'running', os: 'Windows 11', ip: '—', resolution: '1920×1080', ua: 'Chrome', proxy: '直连', lang: 'zh-CN', webrtc: '替换', timezone: 'Asia/Shanghai' },
        })));
      }
    }).catch(() => {});
    load();
    const iv = setInterval(load, 8000);
    return () => { alive = false; clearInterval(iv); };
  }, [api]);
  const shownAccounts = realAccts || accounts;

  const validCnt = shownAccounts.filter(a => a.tokenValid).length;
  const totalComments = shownAccounts.reduce((s, a) => s + a.lastRun.comments, 0);
  const totalDm = shownAccounts.reduce((s, a) => s + a.lastRun.dmSent, 0);
  const totalFail = shownAccounts.reduce((s, a) => s + a.lastRun.dmFail, 0);
  const fpRunning = shownAccounts.filter(a => a.fp.status === 'running').length;
  const fpSet = useMemo(() => {
    const map = new Map();
    shownAccounts.forEach(a => { if (!map.has(a.fp.name)) map.set(a.fp.name, a.fp); });
    return Array.from(map.values());
  }, [shownAccounts]);

  useEffect(() => {
    const h = e => { if (e.key === 'Escape') { if (proxyAcct) setProxyAcct(null); else if (reviewAccount) setReviewAccount(null); else if (addOpen) setAddOpen(false); } };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [proxyAcct, reviewAccount, addOpen]);

  const checkAll = () => {
    if (window.ApiBridge && window.ApiBridge.ready) {
      api.getAccounts().then(d => push(d && d.ok ? '已刷新全部账号状态' : '刷新失败')).catch(e => push('刷新异常: ' + e));
      return;
    }
    setAccounts(accounts.map(a => ({ ...a, lastCheck: tick() })));
    push('已对全部 ' + accounts.length + ' 个账号执行凭证校验');
  };
  const toggleValid = (id) => {
    setAccounts(accounts.map(a => a.id === id ? { ...a, tokenValid: !a.tokenValid } : a));
  };
  const toggleBatch = (id) => {
    setBatchSel(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
  };
  const batchAll = () => {
    if (batchSel.size === shownAccounts.length) setBatchSel(new Set());
    else setBatchSel(new Set(shownAccounts.map(a => a.id)));
  };
  const batchCheck = () => {
    if (!batchSel.size) { push('请先勾选账号'); return; }
    setAccounts(accounts.map(a => batchSel.has(a.id) ? { ...a, lastCheck: tick() } : a));
    push('已对 ' + batchSel.size + ' 个所选账号执行凭证校验');
  };
  const batchExport = () => {
    if (!batchSel.size) { push('请先勾选账号'); return; }
    push('已导出 ' + batchSel.size + ' 个账号的运行数据');
  };
  const batchDelete = () => {
    if (!batchSel.size) { push('请先勾选账号'); return; }
    if (window.ApiBridge && window.ApiBridge.ready) {
      const ids = Array.from(batchSel);
      Promise.all(ids.map(id => {
        const a = shownAccounts.find(x => x.id === id);
        return a ? api.removeAccount(a.name).catch(() => ({})) : Promise.resolve({});
      })).then(() => { push('已删除 ' + ids.length + ' 个账号'); setBatchSel(new Set()); setBatchMode(false); });
      return;
    }
    setAccounts(accounts.filter(a => !batchSel.has(a.id)));
    push('已删除 ' + batchSel.size + ' 个账号');
    setBatchSel(new Set());
    setBatchMode(false);
  };
  const addAccount = () => {
    const name = addForm.name.trim();
    const uid = addForm.uid.trim();
    if (!name || !uid) { push('请填写昵称与 UID'); return; }
    if (window.ApiBridge && window.ApiBridge.ready) {
      api.addAccount(name).then(r => {
        if (r && r.ok) { push('已新增账号 ' + name + '（请在守护中扫码登录）'); setAddOpen(false); setAddForm({ name: '', uid: '', cookie: '' }); }
        else push('新增失败: ' + ((r && r.error) || ''));
      }).catch(e => push('新增异常: ' + e));
      return;
    }
    const nu = {
      id: 'a' + Date.now(),
      name, uid,
      hue: [340, 100, 200, 60, 160][Math.floor(Math.random() * 5)],
      tokenValid: true, tokenExpire: '2027-01-01', lastCheck: '刚刚',
      lastRun: { room: '—', roomUrl: '', time: '—', duration: '—', totalRuns: 0, comments: 0, dmSent: 0, dmSuccess: 0, dmFail: 0, dmAfterLive: 0 },
      fp: { name: 'BitBrowser · Profile 新增', status: 'stopped', os: 'Windows 11', ip: '—', resolution: '1920×1080', ua: 'Chrome 126.0.6478.126', proxy: '直连', lang: 'zh-CN', webrtc: '替换', timezone: 'Asia/Shanghai' },
    };
    setAccounts(list => [nu, ...list]);
    setAddOpen(false);
    setAddForm({ name: '', uid: '', cookie: '' });
    push('已新增账号 ' + name);
  };

  return (
    <div>
      <div className="section-head">
        <div>
          <h2>账号管理</h2>
          <div className="desc">授权账号凭证监控 · 运行日志 · 指纹浏览器环境</div>
        </div>
        <div className="head-row">
          <button className="btn ghost" data-od-id="acct-add" onClick={() => setAddOpen(true)}>新增账号</button>
          <button className="btn ghost" data-od-id="acct-batch" onClick={() => { setBatchMode(b => !b); setBatchSel(new Set()); }}>{batchMode ? '退出批量' : '批量管理'}</button>
          <button className="btn ghost" onClick={checkAll}>全部校验</button>
          {window.ApiBridge && window.ApiBridge.ready ? (
            <>
              <button className="btn ghost" onClick={() => api.startBrowserDaemon().then(r => push(r && r.ok ? '凭证守护已启动' : '启动失败')).catch(e => push('异常: ' + e))}>启动凭证守护</button>
              <button className="btn ghost" onClick={() => api.stopBrowserDaemon().then(r => push(r && r.ok ? '凭证守护已停止' : '停止失败')).catch(e => push('异常: ' + e))}>停止凭证守护</button>
              <button className="btn ghost" onClick={() => api.startRecvDaemon().then(r => push(r && r.ok ? '私信接收守护已启动' : '启动失败')).catch(e => push('异常: ' + e))}>启动私信守护</button>
              <button className="btn ghost" onClick={() => api.stopRecvDaemon().then(r => push(r && r.ok ? '私信接收守护已停止' : '停止失败')).catch(e => push('异常: ' + e))}>停止私信守护</button>
              <button className="btn primary" onClick={() => push('已刷新所有账号状态')}>刷新状态</button>
            </>
          ) : (
            <>
              <button className="btn primary" onClick={() => push('已刷新所有账号状态')}>刷新状态</button>
              <span className="demo-tag">未连接</span>
            </>
          )}
        </div>
      </div>

      <div className="acct-summary">
        <div className="card stat" data-od-id="acct-total">
          <span className="label">已授权账号</span>
          <span className="num">{shownAccounts.length}<span className="unit">个</span></span>
        </div>
        <div className="card stat" data-od-id="acct-valid">
          <span className="label">有效凭证</span>
          <span className="num" style={{ color: 'var(--ok)' }}>{validCnt}<span className="unit">个</span></span>
        </div>
        <div className="card stat" data-od-id="acct-expired">
          <span className="label">过期 / 异常</span>
          <span className="num" style={{ color: 'var(--danger)' }}>{shownAccounts.length - validCnt}<span className="unit">个</span></span>
        </div>
        <div className="card stat" data-od-id="acct-fp">
          <span className="label">指纹浏览器在线</span>
          <span className="num" style={{ color: 'var(--accent)' }}>{fpRunning}<span className="unit">/ {fpSet.length}</span></span>
        </div>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }} data-od-id="account-list">
        {batchMode && (
          <div className="batch-bar" data-od-id="acct-batch-bar">
            <button className="btn sm ghost" onClick={batchAll}>{batchSel.size === shownAccounts.length ? '取消全选' : '全选'}</button>
            <span className="batch-count">已选 <b style={{ color: 'var(--accent)', fontFamily: 'var(--font-mono)' }}>{batchSel.size}</b> / {shownAccounts.length} 个账号</span>
            <div style={{ flex: 1 }} />
            <button className="btn sm ghost" onClick={batchCheck}>批量校验</button>
            <button className="btn sm ghost" onClick={batchExport}>批量导出</button>
            <button className="btn sm ghost" style={{ color: 'var(--danger)', borderColor: 'var(--danger)' }} onClick={batchDelete}>删除所选</button>
          </div>
        )}
        {shownAccounts.map(a => (
          <div className="card acct-card" key={a.id} data-od-id={'acct-' + a.id}>
            <div className="acct-header">
              {batchMode && <input type="checkbox" className="batch-chk" checked={batchSel.has(a.id)} onChange={() => toggleBatch(a.id)} aria-label={'选择 ' + a.name} />}
              <Avatar name={a.name} h={a.hue} lg />
              <div className="info">
                <div className="nm">
                  {a.name}
                  <Pill c={a.tokenValid ? 'ok' : 'danger'}>{a.tokenValid ? '凭证有效' : '凭证过期'}</Pill>
                </div>
                <div className="uid">UID {a.uid} · 上次校验 {a.lastCheck}</div>
              </div>
              <div className="ops">
                <button className="btn sm ghost" onClick={() => toggleValid(a.id)}>{a.tokenValid ? '模拟过期' : '模拟刷新'}</button>
                <button className="btn sm ghost" onClick={() => setReviewAccount(a)}>查阅模式</button>
              </div>
            </div>
            <div className="acct-body">
              <div className="acct-section">
                <h4>上次运行日志</h4>
                <div className="acct-row"><span className="k">直播间</span><span className="v" style={{ display: 'flex', alignItems: 'center', gap: 6, color: a.lastRun.room === '—' ? 'var(--muted)' : 'var(--fg)' }}>{a.lastRun.room}{a.lastRun.roomUrl && <a href={a.lastRun.roomUrl} target="_blank" rel="noopener noreferrer" className="btn sm ghost" style={{ height: 24, padding: '0 8px', fontSize: 11, lineHeight: 1 }} onClick={() => push('已打开直播间：' + a.lastRun.room)}>前往直播间</a>}</span></div>
                <div className="acct-row"><span className="k">运行时间</span><span className="v">{a.lastRun.time}</span></div>
                <div className="acct-row"><span className="k">运行时长</span><span className="v">{a.lastRun.duration}</span></div>
                <div className="acct-row"><span className="k">累计运行</span><span className="v">{a.lastRun.totalRuns} 次</span></div>
                <div className="acct-log-grid" style={{ marginTop: 8 }}>
                  <div className="acct-log-cell">
                    <div className="lc-label">捕获评论</div>
                    <div className="lc-val">{a.lastRun.comments.toLocaleString()}</div>
                  </div>
                  <div className="acct-log-cell">
                    <div className="lc-label">发送私信</div>
                    <div className="lc-val" style={{ color: 'var(--accent)' }}>{a.lastRun.dmSent}</div>
                  </div>
                  <div className="acct-log-cell">
                    <div className="lc-label">下播私信</div>
                    <div className="lc-val" style={{ color: 'var(--warn)' }}>{a.lastRun.dmAfterLive}</div>
                  </div>
                  <div className="acct-log-cell">
                    <div className="lc-label">成功</div>
                    <div className="lc-val" style={{ color: 'var(--ok)' }}>{a.lastRun.dmSuccess}</div>
                  </div>
                  <div className="acct-log-cell">
                    <div className="lc-label">失败</div>
                    <div className="lc-val" style={{ color: 'var(--danger)' }}>{a.lastRun.dmFail}</div>
                  </div>
                </div>
              </div>
              <div className="acct-section">
                <h4>关联指纹浏览器</h4>
                <div className="fp-card">
                  <div className="fp-header">
                    <Dot c={a.fp.status === 'running' ? 'ok' : 'warn'} pulse={a.fp.status === 'running'} />
                    <span className="nm">{a.fp.name}</span>
                    <Pill c={a.fp.status === 'running' ? 'ok' : 'warn'}>{a.fp.status === 'running' ? '运行中' : '已停止'}</Pill>
                    <div style={{ flex: 1 }} />
                    <button className="btn sm ghost" onClick={() => { setProxyAcct(a); setProxyForm({ type: a.fp.proxy.includes('SOCKS') ? 'socks5' : a.fp.proxy.includes('HTTP') ? 'http' : 'direct', host: a.fp.proxy.includes('·') ? a.fp.proxy.split('·')[1]?.split(':')[0] || '' : '', port: a.fp.proxy.includes('·') ? a.fp.proxy.split('·')[1]?.split(':')[1] || '' : '', user: '', pass: '', testUrl: '' }); setProxyTestResult(null); push('已打开代理配置 · ' + a.name); }}>代理配置</button>
                  </div>
                  <dl className="fp-env">
                    <dt>系统</dt><dd>{a.fp.os}</dd>

                </div>
              </div>
