          </div>
        ))}
      </div>

      <AnimatePresence>
        {reviewAccount && <AccountReview key="account-review" account={reviewAccount} onClose={() => setReviewAccount(null)} push={push} goMsg={goMsg} />}
        {proxyAcct && (
          <ProxyDrawer
            key="proxy-drawer"
            account={proxyAcct}
            form={proxyForm}
            setForm={setProxyForm}
            testing={proxyTesting}
            testResult={proxyTestResult}
            onTest={() => {
              setProxyTesting(true);
              setTimeout(() => {
                const ok = Math.random() > 0.3;
                setProxyTestResult({
                  ok,
                  msg: ok
                    ? `连接成功 · ${proxyForm.type}://${proxyForm.host}${proxyForm.port ? ':' + proxyForm.port : ''} → ${(Math.random() * 200 + 50).toFixed(0)}ms`
                    : `连接超时 · 请检查代理地址和端口是否正确`
                });
                setProxyTesting(false);
                push(ok ? '代理连接测试成功' : '代理连接测试失败');
              }, 1500);
            }}
            onSave={() => {
              setAccounts(accts => accts.map(a => a.id === proxyAcct.id ? { ...a, fp: { ...a.fp, proxy: proxyForm.type === 'direct' ? '直连' : proxyForm.type.toUpperCase() + ' · ' + proxyForm.host + ':' + proxyForm.port } } : a));
              push('代理配置已保存 · ' + proxyAcct.name);
              setProxyAcct(null);
            }}
            onClose={() => setProxyAcct(null)}
          />
        )}
        {addOpen && (
          <AccountDrawer
            key="account-drawer"
            form={addForm}
            setForm={setAddForm}
            onSave={addAccount}
            onClose={() => setAddOpen(false)}
          />
        )}
      </AnimatePresence>
    </div>
  );
}

            )}
            {form.type === 'direct' && (
              <div style={{ padding: '10px 14px', borderRadius: 8, background: 'var(--surface-2)', fontSize: 12, color: 'var(--muted)' }}>
                直连模式下无需测试，流量将不经代理直接发出
              </div>
            )}
          </div>

          <div className="card">
            <h3>当前配置预览</h3>
            <div style={{ display: 'grid', gridTemplateColumns: '80px 1fr', gap: '6px 10px', fontSize: 12.5 }}>
              <span style={{ color: 'var(--muted)' }}>代理类型</span>
              <span className="mono" style={{ fontWeight: 600 }}>{form.type.toUpperCase()}</span>
              <span style={{ color: 'var(--muted)' }}>地址</span>
              <span className="mono">{form.type === 'direct' ? '直连' : (form.host + (form.port ? ':' + form.port : ''))}</span>
              <span style={{ color: 'var(--muted)' }}>认证</span>
              <span className="mono">{form.user ? form.user + ' / ●●●●' : '无'}</span>
              <span style={{ color: 'var(--muted)' }}>影响账号</span>
              <span>{a.name} ({a.uid})</span>
            </div>
          </div>
        </div>
        <div className="drawer-foot">
          <button className="btn ghost" onClick={onClose}>取消</button>
          <button className="btn primary" onClick={onSave}>保存配置</button>
        </div>
      </motion.div>
    </>
  );
}

/* ---------- 新增账号抽屉 ---------- */
function AccountDrawer({ form, setForm, onSave, onClose }) {
  return (
    <>
      <motion.div key="acct-backdrop" className="drawer-backdrop" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} transition={{ duration: .15 }} onClick={onClose} />
      <motion.div key="acct-drawer" className="drawer" initial={{ x: '100%' }} animate={{ x: 0 }} exit={{ x: '100%' }} transition={{ type: 'spring', damping: 28, stiffness: 320 }} data-od-id="acct-add-drawer">
        <div className="drawer-head">
          <Avatar name="+" h={200} />
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 600, fontSize: 14 }}>新增授权账号</div>
            <div className="mono" style={{ fontSize: 11.5, color: 'var(--muted)' }}>授权新抖音账号并创建指纹环境</div>
          </div>
          <button className="btn ghost" onClick={onClose} style={{ fontSize: 18, padding: '4px 8px', lineHeight: 1 }}>×</button>
        </div>
        <div className="drawer-body">
          <div className="card" style={{ marginBottom: 14 }}>
            <h3>账号信息</h3>
            <div className="grid cols-2" style={{ gap: 12 }}>
              <div className="field">
                <label>昵称</label>
                <input className="input" placeholder="如：阿澈探店" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} autoFocus />
              </div>
              <div className="field">
                <label>UID</label>
                <input className="input mono" placeholder="UC_xxxxxxxx" value={form.uid} onChange={e => setForm(f => ({ ...f, uid: e.target.value }))} />
              </div>
            </div>
            <div className="field" style={{ marginTop: 12 }}>
              <label>Cookie <span style={{ color: 'var(--muted)', fontWeight: 400 }}>(可选 · 留空则扫码授权)</span></label>
              <textarea className="input mono" rows={3} placeholder="粘贴 Cookie 字符串，用于免扫码登录" value={form.cookie} onChange={e => setForm(f => ({ ...f, cookie: e.target.value }))} style={{ resize: 'vertical' }} />
            </div>
          </div>
          <div style={{ padding: '10px 14px', borderRadius: 8, background: 'var(--surface-2)', fontSize: 12, color: 'var(--muted)', lineHeight: 1.6 }}>
            新增账号将自动创建关联指纹浏览器环境（默认「BitBrowser · Profile 新增」，直连代理）。保存后可在账号卡片中配置代理与凭证校验。
          </div>
        </div>
        <div className="drawer-foot">
          <button className="btn ghost" onClick={onClose}>取消</button>
          <button className="btn primary" onClick={onSave} disabled={!form.name.trim() || !form.uid.trim()}>确认新增</button>
        </div>
      </motion.div>
    </>
  );
}

/* ---------- 应用 ---------- */
function App() {
  const [tab, setTabState] = useState(() => {
    try { return localStorage.getItem('dy:tab') || 'overview'; } catch (_) { return 'overview'; }
  });
  const [toasts, setToasts] = useState([]);
  const [goDm, setGoDm] = useState(null);
  const [overview, setOverview] = useState(null);
  const [ready, setReady] = useState(false);
  const setTab = (t) => { setTabState(t); try { localStorage.setItem('dy:tab', t); } catch (_) {} };
  const push = useCallback((msg) => {
    const id = ++cid;
    setToasts(ts => [...ts.slice(-2), { id, msg }]);
    setTimeout(() => setToasts(ts => ts.filter(x => x.id !== id)), 2600);
  }, []);
  const goMsg = useCallback((name, text) => {
    setGoDm({ name, text: text || '' });
    setTab('msg');
  }, []);

  // 统一调用后端：未就绪时自动走 mock（null），就绪后返回真实数据
  const api = useMemo(() => ({
    ready: () => window.ApiBridge && window.ApiBridge.ready,
    getOverview: () => window.ApiBridge.getOverview ? window.ApiBridge.getOverview() : Promise.resolve(null),
    getStats: () => window.ApiBridge.getStats ? window.ApiBridge.getStats() : Promise.resolve(null),
    getConversations: (a) => window.ApiBridge.getConversations ? window.ApiBridge.getConversations(a) : Promise.resolve(null),
    getConversation: (a, c) => window.ApiBridge.getConversation ? window.ApiBridge.getConversation(a, c) : Promise.resolve(null),
    getAccounts: () => window.ApiBridge.getAccounts ? window.ApiBridge.getAccounts() : Promise.resolve(null),
    getTasks: () => window.ApiBridge.getTasks ? window.ApiBridge.getTasks() : Promise.resolve(null),
    start: (cfg) => window.ApiBridge.start ? window.ApiBridge.start(cfg) : Promise.resolve({ ok: false }),
    pause: () => window.ApiBridge.pause ? window.ApiBridge.pause() : Promise.resolve({ ok: false }),
    resume: () => window.ApiBridge.resume ? window.ApiBridge.resume() : Promise.resolve({ ok: false }),
    stop: () => window.ApiBridge.stop ? window.ApiBridge.stop() : Promise.resolve({ ok: false }),
    setMaxTarget: (n) => window.ApiBridge.setMaxTarget ? window.ApiBridge.setMaxTarget(n) : Promise.resolve({ ok: false }),
    saveConfig: (cfg) => window.ApiBridge.saveConfig ? window.ApiBridge.saveConfig(cfg) : Promise.resolve({ ok: false }),
    saveDmPool: (rows) => window.ApiBridge.saveDmPool ? window.ApiBridge.saveDmPool(rows) : Promise.resolve({ ok: false }),
    sendDm: (a, c, t) => window.ApiBridge.sendDm ? window.ApiBridge.sendDm(a, c, t) : Promise.resolve({ ok: false }),
    exportStats: () => window.ApiBridge.exportStats ? window.ApiBridge.exportStats() : Promise.resolve({ ok: false }),
    setCurrent: (n) => window.ApiBridge.setCurrent ? window.ApiBridge.setCurrent(n) : Promise.resolve({ ok: false }),
    setRoles: (m, s) => window.ApiBridge.setRoles ? window.ApiBridge.setRoles(m, s) : Promise.resolve({ ok: false }),
    addAccount: (n) => window.ApiBridge.addAccount ? window.ApiBridge.addAccount(n) : Promise.resolve({ ok: false }),
    removeAccount: (n) => window.ApiBridge.removeAccount ? window.ApiBridge.removeAccount(n) : Promise.resolve({ ok: false }),
    startBrowserDaemon: (a) => window.ApiBridge.startBrowserDaemon ? window.ApiBridge.startBrowserDaemon(a) : Promise.resolve({ ok: false }),
    stopBrowserDaemon: () => window.ApiBridge.stopBrowserDaemon ? window.ApiBridge.stopBrowserDaemon() : Promise.resolve({ ok: false }),
    startRecvDaemon: () => window.ApiBridge.startRecvDaemon ? window.ApiBridge.startRecvDaemon() : Promise.resolve({ ok: false }),
    stopRecvDaemon: () => window.ApiBridge.stopRecvDaemon ? window.ApiBridge.stopRecvDaemon() : Promise.resolve({ ok: false }),
    refreshBrowserDaemon: (a) => window.ApiBridge.refreshBrowserDaemon ? window.ApiBridge.refreshBrowserDaemon(a) : Promise.resolve({ ok: false }),
  }), []);

  // 概览：每 2.5s 轮询，驱动状态条与概览页
  useEffect(() => {
    let alive = true;
    const tick = () => {
      (window.ApiBridge && window.ApiBridge.ready
        ? api.getOverview()
        : Promise.resolve(null)).then(d => {
        if (!alive) return;
        setReady(!!(window.ApiBridge && window.ApiBridge.ready));
        if (d) setOverview(d);
      }).catch(() => {});
    };
    tick();
    const iv = setInterval(tick, 2500);
    return () => { alive = false; clearInterval(iv); };
  }, [api]);

  const T = tab;
  return (
    <div className="app">
      <Header tab={T} setTab={setTab} overview={overview} ready={ready} />
      <main className="main">
        <AnimatePresence mode="wait">
          <motion.div key={T} initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} transition={{ duration: .16 }}>
            {T === 'overview' && <Overview push={push} api={api} overview={overview} ready={ready} />}
            {T === 'crawl' && <Crawl push={push} goMsg={goMsg} api={api} overview={overview} />}
            {T === 'live' && <Live push={push} goMsg={goMsg} api={api} ready={ready} />}
            {T === 'msg' && <Messages push={push} goDm={goDm} api={api} />}
            {T === 'tasks' && <Tasks push={push} api={api} overview={overview} />}
            {T === 'accounts' && <Accounts push={push} goMsg={goMsg} api={api} />}
            {T === 'settings' && <Settings push={push} api={api} />}
          </motion.div>
        </AnimatePresence>
      </main>
      <div className="toasts">
        {toasts.map(t => <div className="toast" key={t.id}>{t.msg}</div>)}
      </div>
    </div>
  );
}

  // 后端桥接：测试版默认用原型 mock 数据，pywebview 加载后由 Python 注入真实 API
  window.ApiBridge = {
    ready: false,
    getOverview: function(){ return Promise.resolve(null); },
    getStats: function(){ return Promise.resolve(null); },
    getConversations: function(){ return Promise.resolve(null); },
    getAccounts: function(){ return Promise.resolve(null); },
    getTasks: function(){ return Promise.resolve(null); },
    sendDm: function(){ return Promise.resolve({ok:true}); },
    exportStats: function(){ return Promise.resolve({ok:true}); },
  };
  window.addEventListener('pywebviewready', function(){
    if (window.pywebview && window.pywebview.api) {
      Object.assign(window.ApiBridge, window.pywebview.api);
      window.ApiBridge.ready = true;
      console.log('[bridge] pywebview api ready');
    }
  });
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
