# ─────────────────────────────────────────────────────────────────────────
# 构建缓存移出源码树（2026-09-29 架构决策 · 用户拍板）
#
# 背景：`src-tauri/target/` 实测单调膨胀（incremental 每次重编新增 ~460M 且
#   旧份不回收；_up_ 每次重建），一次构建即 4.0G、历史峰值 42G。根因 =
#   「部署路径/源码路径隔离」从未覆盖**编译期缓存**（cargo 默认把它放项目内）。
#
# 铁律（本文件即该铁律的机械落点之一）：**源码树零构建产物**。
#   ⇒ 显式把 target-dir 重定向到树外，与既有环境根（C:\temp\flowcap_design）
#     同族、按环境隔离（design / test 各一份，互不串用）。
#
# 路径字面量**只在本文件出现一处**（SSOT）；scripts/build_paths.py 负责解析，
#   deploy.py / package_installer.py / verify_build.py 一律经它取路径。
#
# ⚠️ 换环境（test 分支）时：改本行路径即可，其余脚本无需改动。
# ⚠️ 回退：删除本文件 → 立即回到默认树内 target（单文件回退，无数据风险）。
# ─────────────────────────────────────────────────────────────────────────
[build]
target-dir = "C:/temp/flowcap_build/design"
